name: CI Pipeline - Marketing Intelligence Platform

# WHEN THIS RUNS:
# - every push to main
# - every pull request
# - every day at 6 AM (automation simulation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Download your code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Install Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # STEP 3: Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Run all tests (this ensures code is correct)
      - name: Run tests
        run: pytest