apiVersion: v1
kind: Namespace
metadata:
  name: marketing-intelligence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-streamlit
  namespace: marketing-intelligence
  labels:
    app: marketing-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marketing-streamlit
  template:
    metadata:
      labels:
        app: marketing-streamlit
    spec:
      containers:
        - name: marketing-streamlit
          image: marketing-intelligence-platform:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8501
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            failureThreshold: 36
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: marketing-streamlit
  namespace: marketing-intelligence
spec:
  type: NodePort
  selector:
    app: marketing-streamlit
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30082
